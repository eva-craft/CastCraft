рпий пала? Хм. Ты неплох. Но лес хранит кое-что похуже гарпий.",objectives:[Cn("d2","Победить Королеву гарпий"),sn("keir","Поговорить с Ловчим Кейром")]},{id:"q4",title:"Сон миконидов",giver:"keir",zone:"senoria",main:!0,xp:800,skillPoints:1,next:"q5",story:"Великий Миконид проснулся. Его споры усыпляют целые караваны, а спящих утаскивают... кто-то. Проверь Споровую рощу.",done:"Микониды служили кому-то — я видел следы волчьих лап у рощи. Крупных лап. Это Серый. Я знаю.",objectives:[Cn("d3","Победить Великого Миконида"),sn("keir","Вернуться к Кейру")]},{id:"q5",title:"Серый",giver:"keir",zone:"senoria",main:!0,xp:1e3,next:"q6",story:"Серый ушёл в лес и не вернулся. Через месяц я нашёл его — но это был уже не он. Тьма забрала его. Я... я не могу сам. Освободи его душу. Прошу.",done:"...Спасибо. Он снова свободен. Никто не возвращается из Керафинского леса — но ты вернулся. Архимаг Велиан хочет тебя видеть.",objectives:[Cn("d4","Освободить душу Серого"),sn("keir","Вернуться к Кейру")]},{id:"q6",title:"Руины Аванура",giver:"archmage_s",zone:"senoria",main:!0,xp:1300,skillPoints:1,next:"q7",story:"Аванур — город-сад у подножия Гор Бюн, павший в Войну с Лигой Тёмных Эльфов. Каменные львы Вечных эльфов стерегут проход в Подземье. Нам нужен этот проход: тёмные эльфы что-то замышляют.",done:"Проход в Подземье открыт. Я чувствую запах паучьего яда и некроэнергии. Лига и Жатва... Это тревожно.",objectives:[Cn("d5","Победить Каменного льва в Руинах Аванура"),sn("archmage_s","Вернуться к Архимагу Велиану")]},{id:"q7",title:"Шахты ламхов",giver:"orn",zone:"senoria",main:!0,xp:1600,next:"q8",story:"Крысолюды-ламхи роют шахты для дроу. Их Король крыс знает все тайные ходы Подземья. Выбей из него путь к городам Лиги.",done:"Путь к Паучьему логову найден. Дальше — священные пауки Араш. Мой друг Грим погиб именно там.",objectives:[Cn("d6","Победить Короля крыс"),sn("orn","Вернуться к Орну")]},{id:"q8",title:"Матерь пауков",giver:"orn",zone:"senoria",main:!0,xp:2e3,skillPoints:1,next:"q9",story:"Матерь пауков охраняет врата четырёх городов дроу. За Грима. За всех, кого она сожрала. Убей её.",done:"Грим отомщён. Но я не чувствую радости. Жрица Лиэль просит тебя зайти — у неё дурные вести.",objectives:[Cn("d7","Победить Матерь пауков"),sn("orn","Вернуться к Орну")]},{id:"q9",title:"Тени Изга-Стира",giver:"priestess",zone:"senoria",main:!0,xp:2400,next:"q10",story:"Изга-Стир — город убийц и отравителей. Его Тени невидимы и проходят сквозь стены. Святое видение, Третий глаз или просто внимание — найди способ увидеть их. Убей Мастера Ядов.",done:"Мастер Ядов мёртв. Ты видел невидимое — Свет был с тобой.",objectives:[Cn("d8","Победить Мастера Ядов"),sn("priestess","Вернуться к жрице Лиэль")]},{id:"q10",title:"Мастер Клинка",giver:"orn",zone:"senoria",main:!0,xp:2800,skillPoints:1,next:"q11",story:"Шагг-Шаил — казармы Лиги. Мастер Клинка готовит армию к новому походу на поверхность. Останови его.",done:"Армия дроу обезглавлена. Велиан говорит, что в Арашемене нашли нечто важное.",objectives:[Cn("d9","Победить Мастера Клинка"),sn("orn","Вернуться к Орну")]},{id:"q11",title:"Башни Арашемена",giver:"archmage_s",zone:"senoria",main:!0,xp:3200,next:"q12",story:"Тёмный Архимаг Арашемена изучает Некроэнергию Мордракса. Если Лига и Жатва объединятся — Пакт падёт. Уничтожь его и его записи.",done:"В его записях — план: Араш обещала Ксанвису души дроу в обмен на чумной туман. Осталась Матрона.",objectives:[Cn("d10","Победить Тёмного Архимага"),sn("archmage_s","Вернуться к Велиану")]},{id:"q12",title:"Манзанар",giver:"orn",zone:"senoria",main:!0,xp:3800,skillPoints:2,next:"q13",story:"Манзанар — храм Паучьей Богини. Матрона говорит голосом Араш. Это конец Лиги — или нас.",done:"Лига разбита. Паучья Богиня притихла. Но торговец Пип принёс странные вести из пустыни.",objectives:[Cn("d11","Победить Матрону Манзанара"),sn("orn","Вернуться к Орну")]},{id:"q13",title:"Гробница Фараона",giver:"merchant",zone:"senoria",main:!0,xp:4200,next:"q14",story:"Слушай, дружок. В Арам'Набау проснулся Наг-Фараон. Моя караванная тропа теперь кладбище. Усмири его — а я расскажу, где прячется Антаку.",done:"Ну ты даёшь! Ладно, уговор: крепость Ханства — на востоке пустыни. Антаку продал души демонам Бастиона.",objectives:[Cn("d12","Победить Нага-Фараона"),sn("merchant","Вернуться к Пипу")]},{id:"q14",title:"Падение Ханства",giver:"orn",zone:"senoria",main:!0,xp:5e3,skillPoints:2,next:"q15",story:"Антаку — полуорк, изгой среди орков и людей. Он заключил договор с демонами Бастиона. Если врата откроются — Сенория сгорит первой. Останови его.",done:"Ханство пало. Король Алдориан услышал о твоих подвигах и зовёт тебя в Ксарот. Корабль ждёт.",objectives:[Cn("d13","Победить полуорка Антаку"),sn("orn","Вернуться к Орну")]},{id:"q15",title:"Аудиенция в Ксароте",giver:"orn",zone:"senoria",main:!0,xp:1500,next:"q16",story:"Плыви в Ксарот — столицу на острове посреди озера Иллар. Король Алдориан ждёт.",done:"Так это ты. Герой Сенории. Пакт слабеет, а Император-лич собирает Жатву. Мне нужна твоя помощь.",objectives:[L_("xaroth","Прибыть в Ксарот"),sn("aldorian","Поговорить с королём Алдорианом")]},{id:"q16",title:"Дыхание Ныргана",giver:"aldorian",zone:"xaroth",main:!0,xp:6e3,skillPoints:2,next:"q17",story:"В Горах Бюн орки открыли портал в Нырган. Сам Зарвенааль, Повелитель Смерти Ныргана, рвётся в Филакт. Закрой портал — убей дракона.",done:"Зарвенааль пал. Нырган отрезан. Теперь путь в Немёртвые земли открыт. Рыцарь Лад поведёт тебя.",objectives:[Cn("d14","Победить дракона Зарвенааля"),sn("aldorian","Вернуться к королю")]},{id:"q17",title:"Вальн, первый павший",giver:"lad",zone:"xaroth",main:!0,xp:7e3,next:"q18",story:"Я не доверяю тебе. Но король верит. Вальн — первый город, павший под чумным туманом. Его некромант продал душу Ксанвису. Докажи, что ты не предатель.",done:"...Хорошо. Ты сдержал слово. Возможно, я ошибался насчёт тебя. Лазан хочет поговорить — не доверяй ему.",objectives:[Cn("d15","Победить Некроманта Вальна"),sn("lad","Вернуться к Рыцарю Ладу")]},{id:"q18",title:"Друг, которого я предал",giver:"lazan",zone:"xaroth",main:!0,xp:8e3,skillPoints:2,next:"q19",story:"Энкелас был моим другом. Когда он умирал, я использовал тёмную магию... и создал первого рыцаря смерти. Он в Лорнвисе. Освободи его — я не могу смотреть ему в глаза.",done:"Мой сын... свободен. Спасибо. Лазан — ты прощён. Пакт нуждается в каждом.",objectives:[Cn("d16","Освободить Энкеласа"),sn("aldorian","Сообщить королю Алдориану")]},{id:"q19",title:"Архилич Кейн",giver:"lad",zone:"xaroth",main:!0,xp:9e3,next:"q20",story:"Кейн был величайшим воином Сенории. Я учился у него. Теперь он Архилич, правая рука Ксанвиса. Это должен сделать я... но моя вера может дрогнуть. Сделай это ты.",done:"Кейн упокоен. Его меч я положу в храме Света. Теперь — Залы Плача.",objectives:[Cn("d17","Победить Архилича Кейна"),sn("lad","Вернуться к Ладу")]},{id:"q20",title:"Плач Сорнэлы",giver:"lazan",zone:"xaroth",main:!0,xp:1e4,skillPoints:2,next:"q21",story:"Сорнэла — дочь Ксанвиса. Он проклял её, обратив в Царицу Банши. Она ненавидит отца, но не может покинуть его. Освободи её — и Ксанвис лишится последнего, что связывало его с жизнью.",done:"Она плакала не от боли — от облегчения. Теперь осталась лишь тень Мордракса... и сам Император.",objectives:[Cn("d18","Освободить Сорнэлу"),sn("lazan","Вернуться к Лазану")]},{id:"q21",title:"Тень Мордракса",giver:"aldorian",zone:"xaroth",main:!0,xp:12e3,skillPoints:2,next:"q22",story:"Мордракс — первый Повелитель Смерти, изгнанный Высшим Светом. Он растворился в тени Некрополя, но тень осталась и питает Ксанвиса. Рассей её.",done:"Тень Мордракса рассеяна. Ксанвис остался один. Иди в Некрополь Личерон — и заверши это.",objectives:[Cn("d19","Рассеять тень Мордракса"),sn("aldorian","Вернуться к королю")]},{id:"q22",title:"Император-лич",giver:"aldorian",zone:"xaroth",main:!0,xp:2e4,skillPoints:3,story:"Ксанвис — павший друид, потерявший отца и дочь, запершийся в собственной смерти. Он собрал Жатву, чтобы бросить вызов самому Свету. Войди в Некрополь Личерон и положи конец Эпохе Теней.",done:"Император-лич повержен. Жатва рассыпалась в прах. Филакт помнит: даже легенды когда-то были просто смертными, которые сделали свой выбор. Ты сделал свой.",objectives:[Cn("d20","Победить Императора-лича Ксанвиса"),sn("aldorian","Вернуться к королю Алдориану")]},{id:"s1",title:"Волчья стая",giver:"keir",zone:"senoria",xp:500,skillPoints:1,story:"Тёмные волки — стая Серого. Они нападают на путников. Проредь их.",done:"Стая отступила. Спасибо.",objectives:[vo("dark_wolf",8,"Убить тёмных волков"),sn("keir","Вернуться к Кейру")]},{id:"s2",title:"Травы и гарпии",giver:"mira",zone:"pintel",xp:300,skillPoints:1,story:"Гарпии не дают собирать корень Керафина. Прогони их.",done:"Теперь отваров хватит на всю деревню!",objectives:[vo("harpy",6,"Убить гарпий в Керафинском лесу"),sn("mira","Вернуться к Мире")]},{id:"s3",title:"Паучий шёлк",giver:"gnome_eng",zone:"senoria",xp:1200,skillPoints:1,requiresLevel:12,story:"Мне нужен паучий шёлк для дронов. Пауки в Подземье. Ты понял.",done:"Великолепно! Технобарон Гримли будет доволен.",objectives:[vo("spider",10,"Убить гигантских пауков"),sn("gnome_eng","Вернуться к Зиксу")]},{id:"s4",title:"Жатва костей",giver:"lad",zone:"xaroth",xp:4e3,skillPoints:1,requiresLevel:28,story:"Скелеты-воины — бывшие эльфы. Дай им покой.",done:"Свет упокоит их.",objectives:[vo("skeleton",15,"Упокоить скелетов-воинов"),sn("lad","Вернуться к Ладу")]},{id:"s5",title:"Крысы в шахтах",giver:"merchant",zone:"senoria",xp:900,skillPoints:1,requiresLevel:10,story:"Ламхи грабят мои караваны! Накажи крысолюдов.",done:"Вот это я понимаю — защита торговли!",objectives:[vo("lamkh",10,"Убить ламхов-крысолюдов"),sn("merchant","Вернуться к Пипу")]}],Vl=Object.fromEntries(yf.map(s=>[s.id,s])),On=(s,e,n,a,o,c,u)=>({id:s,name:e,role:n,color:a,x:o,z:c,lines:u}),ZA=[On("vorn","Старейшина Ворн","Старейшина Пинтеля",9268835,0,-8,["Пинтель — тихая деревня... была. Пока гоблины Ныргана не перекрыли дорогу на Сенорию.","Высший Свет хранит нас, но меч и магия нужнее."]),On("mira","Знахарка Мира","Целительница",8505220,10,4,["Пей отвар из корня Керафина — он лечит раны.","Говорят, в Керафинском лесу ходит тёмный дух волка. Ловчий Кейр ищет его до сих пор."]),On("tob","Кузнец Тоб","Кузнец",9479342,-11,6,["Дворфы Молотора куют лучше, но и мои клинки сгодятся против гоблина.","Не вздумай колдовать в деревне — стража свяжет и в яму бросит на тридцать ударов сердца!"]),On("guard_p","Стражник Пинтеля","Стража",6323595,0,14,["Порядок прежде всего. Нападёшь на кого-то в деревне — отправишься в тюрьму.","Дорога на восток ведёт к Сенории. Там гоблины."])],KA=[On("orn","Капитан Орн","Капитан стражи Сенории",1402304,0,-12,["Сенория держится, но на сколько? Гоблины в пещерах, гарпии в лесу, а в Немёртвых землях шевелится сама смерть.","Мой друг Грим погиб в Подземье. Я не забыл."]),On("keir","Ловчий Кейр","Охотник",7162945,18,6,["Серый ушёл в лес и не вернулся. Через месяц я нашёл его... но это был уже не он.","Никто не возвращается из Керафинского леса. Никто."]),On("archmage_s","Архимаг Велиан","Глава Академии Сенории",8280002,-16,-4,["Некроэнергия — ересь Мордракса. Но изучать врага необходимо.","Открой древо навыков клавишей K. Каждый уровень даёт очко."]),On("priestess","Жрица Лиэль","Жрица Высшего Света",16773494,14,-10,["Свет не спас Келебора — так начался путь Ксанвиса во тьму. Не повторяй его ошибки.","Святое видение рассеивает туман войны. Используй его мудро."]),On("merchant","Торговец Пип","Лепрекон-торговец",4431943,-8,12,["Златогорье платит золотом, Молотор — сталью, а Флюкс — безумными изобретениями!","Радужный мост? Только за очень неожиданную плату."]),On("guard_s","Страж Сенории","Стража",4545124,8,16,["В городе магию не применять. Нарушителей ждёт тюрьма.","Порталы на площади ведут в дикие земли."]),On("gnome_eng","Инженер Зикс","Гном из Флюкса",2541274,-20,10,["Технобарон Гримли говорит, что технологии заменят магию. Я пока не уверен.","Мои дроны видят сквозь туман! Ну...
